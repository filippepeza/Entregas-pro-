<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123f68">

<title>Entregas PRO</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f3f6f9;
font-family:Arial,sans-serif;
color:#17222d
}

header{
background:#123f68;
color:white;
padding:20px
}

header h1{
margin:0;
font-size:24px
}

main{
max-width:600px;
margin:auto;
padding:12px
}

nav{
display:flex;
gap:7px;
overflow:auto;
margin-bottom:12px
}

button{
background:#123f68;
color:white;
border:0;
border-radius:10px;
padding:12px;
font-weight:bold;
font-size:15px
}

nav button{
white-space:nowrap
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.card{
padding:15px;
border-radius:15px;
color:white
}

.card b{
font-size:22px;
display:block;
margin-top:8px
}

.verde{background:#198754}
.azul{background:#0878c9}
.vermelho{background:#c84141}
.laranja{background:#df8307}
.roxo{background:#7045a6}

.painel{
background:white;
padding:16px;
border-radius:15px;
margin:12px 0
}

input,select{
width:100%;
padding:13px;
margin:6px 0 12px;
border:1px solid #ccd5dd;
border-radius:10px;
font-size:16px
}

.salvar{
width:100%;
padding:15px
}

.oculto{
display:none
}
</style>
</head>

<body>

<header>
<h1>🚚 Entregas PRO</h1>
<div>Meu controle na estrada</div>
</header>

<main>

<nav>
<button onclick="abrir('inicio')">Início</button>
<button onclick="abrir('rota')">+ Rota</button>
<button onclick="abrir('comb')">⛽</button>
<button onclick="abrir('desp')">💸</button>
</nav>

<section id="inicio">

<div class="cards">

<div class="card verde">
Receita
<b id="receita">R$ 0,00</b>
</div>

<div class="card azul">
Resultado
<b id="resultado">R$ 0,00</b>
</div>

<div class="card vermelho">
Custos
<b id="custos">R$ 0,00</b>
</div>

<div class="card laranja">
KM rodados
<b id="km">0</b>
</div>

<div class="card roxo">
Entregas
<b id="entregas">0</b>
</div>

</div>

<div class="painel">
<h3>Resumo</h3>
<p id="resumo"></p>
</div>

</section>


<section id="rota" class="oculto">

<div class="painel">

<h2>📦 Registrar rota</h2>

<label>Data</label>
<input id="dataRota" type="date">

<label>Operação / Transportadora</label>
<select id="transportadora">
<option>Shopee</option>
<option>Mercado Livre</option>
<option>Outra</option>
</select>

<label>Destino / Região</label>
<input id="destino"
placeholder="Ex.: Jurerê / Florianópolis">

<label>Total de entregas</label>
<input id="qtd"
type="number">

<label>KM rodados</label>
<input id="kmRota"
type="number"
step="0.1">

<label>Valor recebido</label>
<input id="valorRota"
type="number"
step="0.01">

<button
class="salvar"
onclick="salvarRota()">
SALVAR ROTA
</button>

</div>

</section>


<section id="comb" class="oculto">

<div class="painel">

<h2>⛽ Abastecimento</h2>

<label>Data</label>
<input id="dataComb"
type="date">

<label>Combustível</label>
<select id="tipoComb">
<option>Etanol</option>
<option>Gasolina</option>
<option>Diesel</option>
</select>

<label>Litros</label>
<input id="litros"
type="number"
step="0.01">

<label>Valor total</label>
<input id="valorComb"
type="number"
step="0.01">

<button
class="salvar"
onclick="salvarComb()">
SALVAR ABASTECIMENTO
</button>

</div>

</section>


<section id="desp" class="oculto">

<div class="painel">

<h2>💸 Registrar gasto</h2>

<label>Data</label>
<input id="dataDesp"
type="date">

<label>Categoria</label>
<select id="categoria">
<option>Alimentação</option>
<option>Pedágio</option>
<option>Estacionamento</option>
<option>Manutenção</option>
<option>Lavagem</option>
<option>Outros</option>
</select>

<label>Valor</label>
<input id="valorDesp"
type="number"
step="0.01">

<label>Observação</label>
<input id="obs"
placeholder="Ex.: Padaria">

<button
class="salvar"
onclick="salvarDespesa()">
SALVAR GASTO
</button>

</div>

</section>

</main>

<script>

const CHAVE="entregasFelipe";

let dados=
JSON.parse(
localStorage.getItem(CHAVE)
)||{
rotas:[],
combustivel:[],
despesas:[]
};

const dinheiro=n=>
Number(n||0)
.toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

function persistir(){

localStorage.setItem(
CHAVE,
JSON.stringify(dados)
);

atualizar();

}

function abrir(secao){

["inicio","rota","comb","desp"]
.forEach(id=>{
document
.getElementById(id)
.classList
.toggle(
"oculto",
id!==secao
);
});

}

function salvarRota(){

dados.rotas.push({

data:dataRota.value,

transportadora:
transportadora.value,

destino:
destino.value,

entregas:
Number(qtd.value||0),

km:
Number(kmRota.value||0),

valor:
Number(valorRota.value||0)

});

persistir();

alert("Rota salva!");

abrir("inicio");

}

function salvarComb(){

dados.combustivel.push({

data:dataComb.value,

tipo:tipoComb.value,

litros:
Number(litros.value||0),

valor:
Number(valorComb.value||0)

});

persistir();

alert("Abastecimento salvo!");

abrir("inicio");

}

function salvarDespesa(){

dados.despesas.push({

data:dataDesp.value,

categoria:
categoria.value,

valor:
Number(valorDesp.value||0),

observacao:
obs.value

});

persistir();

alert("Gasto salvo!");

abrir("inicio");

}

function atualizar(){

const receita=
dados.rotas.reduce(
(a,x)=>a+x.valor,0
);

const combustivel=
dados.combustivel.reduce(
(a,x)=>a+x.valor,0
);

const despesas=
dados.despesas.reduce(
(a,x)=>a+x.valor,0
);

const custos=
combustivel+despesas;

const resultado=
receita-custos;

const kmTotal=
dados.rotas.reduce(
(a,x)=>a+x.km,0
);

const entregasTotal=
dados.rotas.reduce(
(a,x)=>a+x.entregas,0
);

document.getElementById("receita")
.textContent=dinheiro(receita);

document.getElementById("custos")
.textContent=dinheiro(custos);

document.getElementById("resultado")
.textContent=dinheiro(resultado);

document.getElementById("km")
.textContent=
kmTotal.toLocaleString("pt-BR");

document.getElementById("entregas")
.textContent=entregasTotal;

document.getElementById("resumo")
.textContent=
dados.rotas.length+
" rota(s), "+
entregasTotal+
" entrega(s) e "+
kmTotal.toLocaleString("pt-BR")+
" km registrados.";

}

const hoje=
new Date()
.toISOString()
.slice(0,10);

dataRota.value=hoje;
dataComb.value=hoje;
dataDesp.value=hoje;

atualizar();

</script>

</body>
</html>
